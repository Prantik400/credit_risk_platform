version: "3.9"

services:
  credit-risk-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neostats_credit_risk
    ports:
      - "5000:5000"
    volumes:
      # Mount data directory 
      - ./data:/app/data
      # Persist trained models across restarts
      - ./models:/app/models
      # Persist SQLite database
      - ./sql:/app/sql
    env_file:
      - .env
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
      - DB_PATH=/app/sql/credit_risk.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
